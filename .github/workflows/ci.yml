name: CI

# Checks the framework itself on every push: types, scheduler, parsers and the
# board/form helpers against local fixtures. Does not touch the live sites.
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  self-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CI: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - run: npm run test:self
      - name: Upload report
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: self-test-report
          path: playwright-report/
          retention-days: 7
