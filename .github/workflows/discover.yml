name: Site discovery

# Crawls the three sites and stores what it finds (pages, menus, forms, login
# pages, API calls, accessibility snapshots, screenshots) on the site-discovery
# branch. Used to calibrate the page objects against the live markup.
# Read-only for the sites: it never submits a form.
on:
  workflow_dispatch:
  push:
    paths:
      - scripts/discover-sites.ts
      - .github/workflows/discover.yml

permissions:
  contents: write

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Crawl sites
        run: node scripts/discover-sites.ts discovery-out
      - name: Store results on the site-discovery branch
        run: |
          export GIT_AUTHOR_NAME="github-actions[bot]" GIT_AUTHOR_EMAIL="41898282+github-actions[bot]@users.noreply.github.com"
          export GIT_COMMITTER_NAME="$GIT_AUTHOR_NAME" GIT_COMMITTER_EMAIL="$GIT_AUTHOR_EMAIL"
          index="$RUNNER_TEMP/discovery-index"
          tree=$(cd discovery-out && GIT_DIR="$(git -C "$GITHUB_WORKSPACE" rev-parse --absolute-git-dir)" GIT_WORK_TREE="$PWD" GIT_INDEX_FILE="$index" sh -c 'git add -A && git write-tree')
          commit=$(git commit-tree "$tree" -m "Site discovery $(date -u +%FT%TZ) (run $GITHUB_RUN_ID)")
          git push --force origin "$commit:refs/heads/site-discovery"
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: site-discovery-${{ github.run_id }}
          path: discovery-out/
          retention-days: 14
