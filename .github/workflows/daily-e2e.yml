name: Daily E2E

# Each project (chessorro, qastarting, spas) runs once a day, at its own time,
# and that time changes every day. GitHub cron cannot express that directly, so
# the workflow wakes up once per hour and scripts/schedule.ts decides which
# project (if any) is due in that hour. Hours with nothing due finish in seconds.
#
# Preview the upcoming times:  npm run schedule
# Regenerate the cron lines:   npm run schedule:cron
on:
  schedule:
    - cron: '7 0 * * *'
    - cron: '30 1 * * *'
    - cron: '53 2 * * *'
    - cron: '16 3 * * *'
    - cron: '39 4 * * *'
    - cron: '2 5 * * *'
    - cron: '25 6 * * *'
    - cron: '48 7 * * *'
    - cron: '11 8 * * *'
    - cron: '34 9 * * *'
    - cron: '57 10 * * *'
    - cron: '20 11 * * *'
    - cron: '43 12 * * *'
    - cron: '6 13 * * *'
    - cron: '29 14 * * *'
    - cron: '52 15 * * *'
    - cron: '15 16 * * *'
    - cron: '38 17 * * *'
    - cron: '1 18 * * *'
    - cron: '24 19 * * *'
    - cron: '47 20 * * *'
    - cron: '10 21 * * *'
    - cron: '33 22 * * *'
    - cron: '56 23 * * *'
  workflow_dispatch:
    inputs:
      projects:
        description: 'Projects to run, comma-separated (chessorro,qastarting,spas) or "all"'
        required: true
        default: all
      suite:
        description: Which tests to run
        type: choice
        options: [all, api, ui]
        default: all

permissions:
  contents: read

jobs:
  plan:
    name: Plan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      projects: ${{ steps.plan.outputs.projects }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: scripts
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Decide which projects are due
        id: plan
        env:
          EVENT: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
          INPUT_PROJECTS: ${{ inputs.projects }}
          SCHEDULE_SEED: ${{ vars.SCHEDULE_SEED }}
          NODE_NO_WARNINGS: 1
        run: |
          if [ "$EVENT" = "schedule" ]; then
            projects=$(node scripts/schedule-cli.ts due "$SCHEDULE")
          else
            projects=$(node scripts/schedule-cli.ts pick "$INPUT_PROJECTS")
          fi
          echo "projects=$projects" >> "$GITHUB_OUTPUT"
          {
            echo "### Today's schedule"
            node scripts/schedule-cli.ts show 1
            echo
            echo "This run ($EVENT $SCHEDULE): \`$projects\`"
          } >> "$GITHUB_STEP_SUMMARY"

  test:
    name: ${{ matrix.project }}
    needs: plan
    if: needs.plan.outputs.projects != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write # publish the Allure report to the gh-pages branch
      pages: read # look up the GitHub Pages URL for the report link
    strategy:
      fail-fast: false
      matrix:
        project: ${{ fromJSON(needs.plan.outputs.projects) }}
    env:
      CI: true
      PROJECT: ${{ matrix.project }}
      # Optional repository variables to point a run at another environment.
      CHESSORRO_URL: ${{ vars.CHESSORRO_URL }}
      QASTARTING_URL: ${{ vars.QASTARTING_URL }}
      SPAS_URL: ${{ vars.SPAS_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run ${{ matrix.project }} tests
        id: tests
        env:
          SUITE: ${{ inputs.suite || 'all' }}
        run: |
          case "$SUITE" in
            api) npx playwright test --project="$PROJECT-api" ;;
            ui)  npx playwright test --project="$PROJECT-ui" ;;
            *)   npx playwright test --project="$PROJECT-api" --project="$PROJECT-ui" ;;
          esac

      # Allure report, hosted on GitHub Pages (gh-pages branch, one folder per project).
      # The link is posted as a run annotation and in the run summary.
      - name: Restore Allure history
        if: ${{ !cancelled() && (steps.tests.outcome == 'success' || steps.tests.outcome == 'failure') }}
        run: bash scripts/allure-pages.sh pull-history "$PROJECT"
      - name: Build Allure report
        if: ${{ !cancelled() && (steps.tests.outcome == 'success' || steps.tests.outcome == 'failure') }}
        env:
          ALLURE_REPORT_NAME: Daily E2E - ${{ matrix.project }}
          SCHEDULE_SLOT: ${{ github.event.schedule }}
        run: |
          ALLURE_SINGLE_FILE=0 ALLURE_OUTPUT=allure-site npx allure generate   # hosted copy
          ALLURE_APPEND_HISTORY=0 npx allure generate                          # single-file copy for the artifact
      - name: Summary
        if: ${{ !cancelled() && (steps.tests.outcome == 'success' || steps.tests.outcome == 'failure') }}
        run: |
          node -e '
            const { stats } = JSON.parse(require("fs").readFileSync("allure-report/summary.json", "utf8"));
            const parts = Object.entries(stats).filter(([k]) => k !== "total").map(([k, v]) => `${v} ${k}`);
            console.log(`### ${process.env.PROJECT}: ${stats.total} tests, ${parts.join(", ")}`);
          ' >> "$GITHUB_STEP_SUMMARY"
      - name: Publish Allure report
        if: ${{ !cancelled() && (steps.tests.outcome == 'success' || steps.tests.outcome == 'failure') }}
        env:
          GH_TOKEN: ${{ github.token }}
          REPORT_BASE_URL: ${{ vars.REPORT_BASE_URL }}
        run: bash scripts/allure-pages.sh publish "$PROJECT" allure-site
      - name: Upload Allure report (single file)
        if: ${{ !cancelled() && (steps.tests.outcome == 'success' || steps.tests.outcome == 'failure') }}
        uses: actions/upload-artifact@v4
        with:
          name: allure-report-${{ matrix.project }}-${{ github.run_id }}
          path: allure-report/
          retention-days: 30

      - name: Upload Playwright report and traces
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.project }}-${{ github.run_id }}
          path: |
            playwright-report/
            reports/
            test-results/
          retention-days: 14
